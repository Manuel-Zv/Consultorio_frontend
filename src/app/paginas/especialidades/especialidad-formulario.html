<div class="dialogo-cabecera">
  <h2>{{ datos ? 'Editar' : 'Nueva' }} especialidad</h2>
  <button type="button" class="btn-icon" (click)="cerrar()" aria-label="Cerrar">
    <span class="material-icons">close</span>
  </button>
</div>

<form [formGroup]="formulario" (ngSubmit)="guardar()">
  <div class="dialogo-cuerpo campos">
    <div class="campo campo-con-icono" [class.invalido]="formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched">
      <label>Nombre</label>
      <span class="material-icons">local_hospital</span>
      <input class="campo-control" formControlName="nombre" />
      @if (formulario.get('nombre')?.hasError('required')) {
        <span class="campo-error">El nombre es obligatorio</span>
      }
    </div>

    <div class="campo">
      <label>Descripción</label>
      <textarea class="campo-control" formControlName="descripcion" rows="3"></textarea>
    </div>
  </div>

  <div class="dialogo-acciones">
    <button type="button" class="btn-outline" (click)="cerrar()">Cancelar</button>
    <button type="submit" class="btn-primary">Guardar</button>
  </div>
</form>
