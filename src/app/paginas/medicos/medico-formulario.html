<div class="dialogo-cabecera">
  <h2>{{ datos ? 'Editar' : 'Nuevo' }} médico</h2>
  <button type="button" class="btn-icon" (click)="cerrar()" aria-label="Cerrar">
    <span class="material-icons">close</span>
  </button>
</div>

<form [formGroup]="formulario" (ngSubmit)="guardar()">
  <div class="dialogo-cuerpo campos">
    <div class="fila-doble">
      <div class="campo" [class.invalido]="formulario.get('numero_identificacion')?.invalid && formulario.get('numero_identificacion')?.touched">
        <label>Número de identificación</label>
        <input class="campo-control" formControlName="numero_identificacion" />
      </div>
      <div class="campo" [class.invalido]="formulario.get('numero_licencia')?.invalid && formulario.get('numero_licencia')?.touched">
        <label>Número de licencia</label>
        <input class="campo-control" formControlName="numero_licencia" />
      </div>
    </div>

    <div class="fila-doble">
      <div class="campo" [class.invalido]="formulario.get('nombres')?.invalid && formulario.get('nombres')?.touched">
        <label>Nombres</label>
        <input class="campo-control" formControlName="nombres" />
      </div>
      <div class="campo" [class.invalido]="formulario.get('apellidos')?.invalid && formulario.get('apellidos')?.touched">
        <label>Apellidos</label>
        <input class="campo-control" formControlName="apellidos" />
      </div>
    </div>

    <div class="campo" [class.invalido]="formulario.get('especialidad_id')?.invalid && formulario.get('especialidad_id')?.touched">
      <label>Especialidad</label>
      <select class="campo-control" formControlName="especialidad_id">
        <option [ngValue]="null" disabled>Selecciona una especialidad</option>
        @for (especialidad of especialidades(); track especialidad.id) {
          <option [ngValue]="especialidad.id">{{ especialidad.nombre }}</option>
        }
      </select>
    </div>

    <div class="campo" [class.invalido]="formulario.get('correo_electronico')?.invalid && formulario.get('correo_electronico')?.touched">
      <label>Correo electrónico</label>
      <input class="campo-control" type="email" formControlName="correo_electronico" />
    </div>

    <div class="campo">
      <label>Teléfono</label>
      <input class="campo-control" formControlName="telefono" />
    </div>
  </div>

  <div class="dialogo-acciones">
    <button type="button" class="btn-outline" (click)="cerrar()">Cancelar</button>
    <button type="submit" class="btn-primary">Guardar</button>
  </div>
</form>
